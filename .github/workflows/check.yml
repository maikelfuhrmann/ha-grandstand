name: Check integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install homeassistant==2026.11.0
      - run: python -m unittest discover -s tests -v
      - run: npm run check
      - run: git diff --exit-code -- custom_components/sports_hub/frontend/sports-hub.js
      - run: python scripts/smoke_ha.py
      - run: python scripts/package.py
