<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grandstand · Preview</title>
<style>html,body{height:100%;margin:0;background:#0b1017}sports-hub-panel{height:100vh}</style>
<sports-hub-panel></sports-hub-panel>
<script type="module">
await import('../custom_components/sports_hub/frontend/sports-hub.js?preview='+Date.now());
const panel=document.querySelector('sports-hub-panel');
const params=new URLSearchParams(location.search);
let response=await fetch((params.has('live')?'./live-data.json':'./demo-data.json')+'?v='+Date.now());
const data=await response.json();
const contexts=await fetch(params.has('live')?'./rich-data.json':'./demo-context.json').then(r=>r.ok?r.json():{}).catch(()=>({}));
const matches=params.has('live')?await fetch('./match-data.json').then(r=>r.ok?r.json():{}).catch(()=>({})):{};
let saved=JSON.parse(localStorage.getItem('sports-hub-preview-dashboards')||'{"dashboards":[],"sidebar":[]}');
panel.panel={config:{entry_id:'preview',version:'0.4.0',preview:true,preview_now:data.generated_at,dashboard:saved.sidebar.find(p=>p.key===params.get('sidebar'))}};
panel.hass={language:params.get('lang')||'de',config:{time_zone:data.time_zone},user:{id:'preview',is_admin:true},panels:{},callWS:async msg=>{
  if(msg.type==='sports_hub/data')return data;
  if(msg.type==='sports_hub/match')return structuredClone(matches[msg.league_id+':'+msg.event_id]||{timeline:[],lineups:[],teams:[],player_tables:[]});
  if(msg.type==='sports_hub/context')return structuredClone(contexts[msg.key]||{events:[],sources:[],news:{articles:[]}});
  if(msg.action==='save'&&msg.confirmed){saved.dashboards=saved.dashboards.filter(p=>p.key!==msg.dashboard.key);saved.dashboards.push(msg.dashboard);}
  if(msg.action==='remove')saved.dashboards=saved.dashboards.filter(p=>p.key!==msg.key);
  if(msg.action==='publish'&&msg.confirmed){const p=saved.dashboards.find(p=>p.key===msg.key);saved.sidebar=saved.sidebar.filter(p=>p.key!==msg.key);saved.sidebar.push({...p,path:'docs/preview.html?sidebar='+encodeURIComponent(p.key)+'&lang='+encodeURIComponent(params.get('lang')||'de')+(params.has('live')?'&live=1':'')});}
  if(msg.action==='unpublish')saved.sidebar=saved.sidebar.filter(p=>p.key!==msg.key);
  localStorage.setItem('sports-hub-preview-dashboards',JSON.stringify(saved));return structuredClone(saved);
}};
</script></html>
